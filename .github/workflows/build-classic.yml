name: Mangayomi Classic Build (Android 6.0 / API 23)
on:
  workflow_dispatch:
concurrency:
  group: classic-build
  cancel-in-progress: false
env:
  FLUTTER_VERSION: "3.32.8"
jobs:
  classic-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - name: Install Android SDK packages
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "cmake;3.22.1" "ndk;26.3.11579264"
      - name: Pub resolution (classic)
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee pubget-classic.log
      - name: Prebuild subsampling native lib (CLASSIC - replaces native-assets hook)
        run: |
          set -e
          TC="$ANDROID_SDK_ROOT/ndk/26.3.11579264/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p android/app/src/main/jniLibs/arm64-v8a android/app/src/main/jniLibs/armeabi-v7a
          "$TC/aarch64-linux-android23-clang++" -shared -fPIC -O2 -std=c++17 -I lib/ffi lib/ffi/image_decoder.cpp -o android/app/src/main/jniLibs/arm64-v8a/libsubsampling_scale_image_view.so
          "$TC/armv7a-linux-androideabi23-clang++" -shared -fPIC -O2 -std=c++17 -I lib/ffi lib/ffi/image_decoder.cpp -o android/app/src/main/jniLibs/armeabi-v7a/libsubsampling_scale_image_view.so
          ls -la android/app/src/main/jniLibs/*/libsubsampling_scale_image_view.so
      - name: Build APK (classic, API 23)
        run: |
          set -o pipefail
          # Release signing falls back to a freshly generated debug keystore:
          # this edition is sideloaded, not distributed via a store.
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1
          fi
          {
            echo "storePassword=android"
            echo "keyPassword=android"
            echo "keyAlias=androiddebugkey"
            echo "storeFile=$HOME/.android/debug.keystore"
          } > android/key.properties
          FLUTTER_SDK=$(dirname "$(dirname "$(readlink -f "$(which flutter)")")")
          {
            echo "sdk.dir=$ANDROID_SDK_ROOT"
            echo "flutter.sdk=$FLUTTER_SDK"
            echo "flutter.buildMode=release"
            echo "flutter.versionName=0.9.95"
            echo "flutter.versionCode=128"
          } > android/local.properties
          cat android/local.properties
          cd android && ./gradlew :app:assembleRelease -Ptarget-platform=android-arm,android-arm64 --stacktrace 2>&1 | tee ../build-classic.log
      - name: Apply Isar kernel gate patch + re-sign (for kernels < 3.16)
        run: |
          set -e
          APK=$(find build android -name "app-release.apk" -path "*outputs*" | head -1)
          echo "built: $APK"
          python3 tool/patch_isar_kernel_gate.py "$APK" mangayomi-classic-v0.9.95-android6.apk
          BT="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          "$BT/zipalign" -f 4 mangayomi-classic-v0.9.95-android6.apk mangayomi-classic-v0.9.95-android6-aligned.apk
          "$BT/apksigner" sign --ks "$HOME/.android/debug.keystore" --ks-pass pass:android --key-pass pass:android mangayomi-classic-v0.9.95-android6-aligned.apk
          mv mangayomi-classic-v0.9.95-android6-aligned.apk mangayomi-classic-v0.9.95-android6.apk
          "$BT/apksigner" verify mangayomi-classic-v0.9.95-android6.apk
          sha256sum mangayomi-classic-v0.9.95-android6.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mangayomi-classic-android6
          path: |
            mangayomi-classic-v0.9.95-android6.apk
            pubget-classic.log
            build-classic.log
          if-no-files-found: warn
          retention-days: 30
