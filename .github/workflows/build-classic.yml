name: Mangayomi Classic Build & Release (Android 6.0 / API 23)

on:
  workflow_dispatch:
    inputs:
      make_release:
        description: "Create the GitHub release when the build succeeds"
        type: boolean
        default: true
      release_tag:
        description: "Release tag override (default: v<version>)"
        type: string
        required: false
        default: ""

concurrency:
  group: classic-build
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.32.8"
  # SHA-256 of the certificate every Classic release ships with
  # (registered as the DEBUG_KEYSTORE_B64 secret). The build aborts when
  # the restored keystore does not match, so CI artifacts always update
  # over existing installs.
  EXPECTED_CERT_SHA256: "0fbbd400807a3fa61fe4701a96ad336fb074b5c87800cdfa033ab3fd52c9cfed"

jobs:
  classic-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - name: Install Android SDK packages
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "cmake;3.22.1" "ndk;26.3.11579264" "ndk;27.0.12077973"
      - name: Restore signing keystore (secret)
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          set -e
          if [ -z "$KEYSTORE_B64" ]; then
            echo "DEBUG_KEYSTORE_B64 secret is not set"
            exit 1
          fi
          mkdir -p "$HOME/.android"
          echo "$KEYSTORE_B64" | base64 -d > "$HOME/.android/debug.keystore"
          FP=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android 2>/dev/null | grep 'SHA256:' | head -1 | sed 's/.*SHA256: *//; s/://g' | tr 'A-F' 'a-f')
          echo "keystore cert SHA256: $FP"
          if [ "$FP" != "$EXPECTED_CERT_SHA256" ]; then
            echo "keystore fingerprint mismatch - refusing to sign with the wrong key"
            exit 1
          fi
          {
            echo "storePassword=android"
            echo "keyPassword=android"
            echo "keyAlias=androiddebugkey"
            echo "storeFile=$HOME/.android/debug.keystore"
          } > android/key.properties
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-classic-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-classic-${{ runner.os }}-
      - name: Pub resolution (classic)
        run: flutter pub get
      - name: Prebuild subsampling native lib (CLASSIC - replaces native-assets hook)
        run: |
          set -e
          TC="$ANDROID_SDK_ROOT/ndk/26.3.11579264/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p android/app/src/main/jniLibs/arm64-v8a android/app/src/main/jniLibs/armeabi-v7a
          "$TC/aarch64-linux-android23-clang++" -shared -fPIC -O2 -std=c++17 -I lib/ffi lib/ffi/image_decoder.cpp -o android/app/src/main/jniLibs/arm64-v8a/libsubsampling_scale_image_view.so
          "$TC/armv7a-linux-androideabi23-clang++" -shared -fPIC -O2 -std=c++17 -I lib/ffi lib/ffi/image_decoder.cpp -o android/app/src/main/jniLibs/armeabi-v7a/libsubsampling_scale_image_view.so
          ls -la android/app/src/main/jniLibs/*/libsubsampling_scale_image_view.so
      - name: Resolve version + write local.properties
        id: ver
        run: |
          set -e
          V=$(grep -E '^version:' pubspec.yaml | head -1 | sed 's/^version: *//; s/ *#.*$//; s/ *$//')
          VNAME="${V%%+*}"
          VCODE="${V##*+}"
          echo "pubspec version: $VNAME + $VCODE"
          echo "vname=$VNAME" >> "$GITHUB_OUTPUT"
          echo "vcode=$VCODE" >> "$GITHUB_OUTPUT"
          FLUTTER_SDK=$(dirname "$(dirname "$(readlink -f "$(which flutter)")")")
          {
            echo "sdk.dir=$ANDROID_SDK_ROOT"
            echo "flutter.sdk=$FLUTTER_SDK"
            echo "flutter.buildMode=release"
            echo "flutter.versionName=$VNAME"
            echo "flutter.versionCode=$VCODE"
          } > android/local.properties
          cat android/local.properties
      - name: Build universal APK
        run: |
          set -o pipefail
          cd android
          # Maven Central rate-limits shared runner IPs (HTTP 429) - retry
          # with backoff; Gradle resumes from its cache between attempts.
          for attempt in 1 2 3; do
            ./gradlew :app:assembleRelease -Ptarget-platform=android-arm,android-arm64 --stacktrace 2>&1 | tee ../build-universal.log && break
            if [ "$attempt" = 3 ]; then
              echo "gradle failed after 3 attempts"
              exit 1
            fi
            echo "gradle attempt $attempt failed - retrying in 60s"
            sleep 60
          done
      - name: Finalize universal APK
        run: |
          set -e
          export LIBCXX_BASE="$ANDROID_SDK_ROOT/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib"
          BT="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          mkdir -p dist
          SRC=$(find build android -name 'app-release.apk' -path '*outputs*' | head -1)
          echo "built: $SRC"
          python3 tool/patch_isar_kernel_gate.py "$SRC" /tmp/fin_patched.apk
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            rm -f /tmp/fin_inj.apk
            python3 tool/classic/inj_libcxx.py /tmp/fin_patched.apk /tmp/fin_inj.apk "$ABI"
            if [ -f /tmp/fin_inj.apk ]; then mv /tmp/fin_inj.apk /tmp/fin_patched.apk; fi
          done
          python3 tool/classic/verify_libcxx.py /tmp/fin_patched.apk
          OUT="dist/mangayomi-classic-v${{ steps.ver.outputs.vname }}-universal.apk"
          "$BT/zipalign" -f -p 4 /tmp/fin_patched.apk /tmp/fin_aligned.apk
          "$BT/apksigner" sign --ks "$HOME/.android/debug.keystore" --ks-pass pass:android --key-pass pass:android --out "$OUT" /tmp/fin_aligned.apk
          "$BT/zipalign" -c 4 "$OUT" && echo ALIGN_OK
          "$BT/apksigner" verify --verbose "$OUT" | head -4
          BADGE=$("$BT/aapt2" dump badging "$OUT")
          echo "$BADGE" | grep -E "package:|native-code|sdkVersion"
          echo "$BADGE" | grep -q "versionCode='${{ steps.ver.outputs.vcode }}'"
          echo "$BADGE" | grep -q "minSdkVersion:'23'"
          echo "UNIVERSAL_FINALIZE_OK $OUT"
      - name: Stop Gradle daemon before splits
        run: |
          (cd android && ./gradlew --stop) || true
          sleep 5
          free -h
          ps aux | grep -i java | head || true
      - name: Build + finalize split APKs (arm64 / armv7)
        run: |
          set -e
          free -h
          export LIBCXX_BASE="$ANDROID_SDK_ROOT/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib"
          BT="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          VNAME="${{ steps.ver.outputs.vname }}"
          VFINAL="${{ steps.ver.outputs.vcode }}"
          build_split() {
            local platform="$1" strip="$2" patch="$3" abi="$4" suffix="$5"
            echo "=== SPLIT $suffix (platform=$platform) ==="
            find build android -name 'app-release.apk' -path '*outputs*' -delete 2>/dev/null || true
            local try
            for try in 1 2 3; do
              if (cd android && ./gradlew --no-daemon :app:assembleRelease -Ptarget-platform="$platform" --stacktrace); then
                break
              fi
              if [ "$try" = 3 ]; then
                echo "gradle failed after 3 attempts"
                return 1
              fi
              echo "gradle attempt $try failed - retrying in 60s"
              sleep 60
            done
            local apk
            apk=$(find build android -name 'app-release.apk' -path '*outputs*' | head -1)
            echo "built: $apk"
            python3 tool/classic/strip_abi.py "$apk" /tmp/split_stripped.apk "$strip"
            python3 "$patch" /tmp/split_stripped.apk /tmp/split_patched.apk
            rm -f /tmp/split_inj.apk
            python3 tool/classic/inj_libcxx.py /tmp/split_patched.apk /tmp/split_inj.apk "$abi"
            if [ -f /tmp/split_inj.apk ]; then mv /tmp/split_inj.apk /tmp/split_patched.apk; fi
            python3 tool/classic/verify_libcxx.py /tmp/split_patched.apk
            local out="dist/mangayomi-classic-v${VNAME}-${suffix}.apk"
            "$BT/zipalign" -f -p 4 /tmp/split_patched.apk /tmp/split_aligned.apk
            "$BT/apksigner" sign --ks "$HOME/.android/debug.keystore" --ks-pass pass:android --key-pass pass:android --out "$out" /tmp/split_aligned.apk
            "$BT/apksigner" verify "$out"
            local badge
            badge=$("$BT/aapt2" dump badging "$out")
            echo "$badge" | grep -E "package:|native-code"
            echo "$badge" | grep -q "versionCode='$VFINAL'"
            echo "$badge" | grep -q "minSdkVersion:'23'"
            [ "$(echo "$badge" | grep 'native-code:')" = "native-code: '$abi'" ]
            echo "=== SPLIT $suffix DONE ==="
          }
          build_split android-arm64 "armeabi-v7a,x86,x86_64" tool/patch_isar_kernel_gate.py arm64-v8a arm64
          build_split android-arm "arm64-v8a,x86,x86_64" tool/classic/patch_v7a_passthrough.py armeabi-v7a armv7
          ls -la dist/
      - name: Upload artifacts (test runs only - release runs publish to the Release instead)
        uses: actions/upload-artifact@v4
        if: ${{ !inputs.make_release }}
        with:
          name: mangayomi-classic-apks
          path: |
            dist/*.apk
            build-universal.log
          if-no-files-found: warn
          retention-days: 7
      - name: Create release
        if: inputs.make_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VNAME="${{ steps.ver.outputs.vname }}"
          VCODE="${{ steps.ver.outputs.vcode }}"
          TAG="${{ inputs.release_tag }}"
          if [ -z "$TAG" ]; then TAG="v${VNAME}"; fi
          {
            echo "## Mangayomi Classic $TAG"
            echo
            echo "Upstream Mangayomi $VNAME base + Classic downgrade stack (minSdk 23). Built with GitHub Actions."
            echo
            echo "All assets: versionCode $VCODE · minSdk 23 · same signing certificate as previous releases."
            echo "The armv7 build does not apply the Isar kernel gate — kernel 3.16 or later is required."
            echo "Requires Android 6.0 (API 23) or later."
          } > dist/notes.md
          gh release create "$TAG" --target "$GITHUB_REF_NAME" --title "Mangayomi Classic $TAG" --notes-file dist/notes.md dist/*.apk
